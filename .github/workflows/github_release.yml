name: Github Release Workflow

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/checkout@v3

      - name: Cache Gradle and wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Build Degoogled Arm64 Release APK
        id: build
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          # Build only the degoogled arm64 release variant.
          bash ./gradlew assembleDegoogledRelease -PciArm64Only=true

      - name: Create Artifact Staging Directory
        if: github.event_name == 'push'
        run: mkdir -p release-artifacts

      - name: Sign Degoogled Arm64 Release APK
        if: github.event_name == 'push'
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs -name '*degoogled*arm64-v8a*release*unsigned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find app/build/outputs -name '*degoogled*release*unsigned.apk' | head -n 1)"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Could not find degoogled release unsigned APK under app/build/outputs"
            find app/build/outputs -maxdepth 5 -type f | sort || true
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-signing-key.jks

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOL_VERSION}/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="/usr/local/lib/android/sdk/build-tools/${BUILD_TOOL_VERSION}/apksigner"
          fi

          "$APKSIGNER" sign \
            --ks release-signing-key.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS_GITHUB }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD_GITHUB }} \
            --out ./release-artifacts/app-degoogled-arm64-v8a-release.apk \
            "$APK_PATH"

          "$APKSIGNER" verify ./release-artifacts/app-degoogled-arm64-v8a-release.apk

          echo "Prepared Degoogled arm64 APK."
          ls -la ./release-artifacts/

      - name: Create Release
        id: create_release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: '> Changelog coming soon'
          draft: false
          prerelease: false
          files: ./release-artifacts/*.apk

      - name: Upload Release APK as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: degoogled-arm64-release-apk
          path: ./release-artifacts/app-degoogled-arm64-v8a-release.apk
          retention-days: 30

      - name: Sign PR Degoogled Arm64 Release APK (debug key)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p pr-release-artifacts

          keytool -genkeypair -v \
            -keystore pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOL_VERSION}/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="/usr/local/lib/android/sdk/build-tools/${BUILD_TOOL_VERSION}/apksigner"
          fi

          APK_PATH="$(find app/build/outputs -name '*degoogled*arm64-v8a*release*unsigned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find app/build/outputs -name '*degoogled*release*unsigned.apk' | head -n 1)"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Could not find degoogled release unsigned APK under app/build/outputs"
            find app/build/outputs -maxdepth 5 -type f | sort || true
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks pr-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out pr-release-artifacts/app-degoogled-arm64-v8a-release.apk \
            "$APK_PATH"
          "$APKSIGNER" verify pr-release-artifacts/app-degoogled-arm64-v8a-release.apk

      - name: Upload PR Release APK as artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-degoogled-arm64-release-apk
          path: pr-release-artifacts/app-degoogled-arm64-v8a-release.apk
          retention-days: 14
